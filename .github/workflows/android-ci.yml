name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: echo-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK for PR / non-main runs
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prepare debug CI artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk Echo-debug.apk

      - name: Upload debug CI artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Echo-debug-${{ github.run_number }}
          path: Echo-debug.apk
          retention-days: 14

      - name: Restore cached Preview test signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.echo-preview-signing/echo-preview-test.jks
          key: echo-preview-test-signing-v1

      - name: Prepare Preview test signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          SIGNING_DIR="$HOME/.echo-preview-signing"
          KEYSTORE_PATH="$SIGNING_DIR/echo-preview-test.jks"
          KEY_ALIAS="echo-preview-test"
          SIGNING_PASSWORD="$(printf '%s' "${GITHUB_REPOSITORY}-echo-preview-test-v1" | sha256sum | cut -c1-24)"

          mkdir -p "$SIGNING_DIR"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::notice::Creating a new test-only Preview signing key for this repository."
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$SIGNING_PASSWORD" \
              -keypass "$SIGNING_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 36500 \
              -dname "CN=Echo Preview Test,O=Echo,C=XX"
            chmod 600 "$KEYSTORE_PATH"
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$SIGNING_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "MESSAGE_RELAY_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "MESSAGE_RELAY_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "MESSAGE_RELAY_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MESSAGE_RELAY_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure signed Preview version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION_CODE=$((3120000 + GITHUB_RUN_NUMBER))
          echo "MESSAGE_RELAY_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "MESSAGE_RELAY_VERSION_NAME=3.12" >> "$GITHUB_ENV"
          echo "Echo Preview versionName=3.12 versionCode=$VERSION_CODE"

      - name: Assemble signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Prepare signed Preview APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk Echo-preview.apk

      - name: Upload signed Preview artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Echo-preview-${{ github.run_number }}-release
          path: Echo-preview.apk
          retention-days: 14

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="preview-${GITHUB_RUN_NUMBER}"
          NOTES=$'测试专用固定签名构建的 Echo Android Preview。versionName=3.12，versionCode='"${MESSAGE_RELAY_VERSION_CODE}"$'，Commit: '"${GITHUB_SHA}"$'。\n\n迁移提示：如果你安装过 Preview #1/#4/#8 等旧随机 Debug 签名版本，需要先完整卸载旧版，再安装本次 Preview。之后只要 GitHub Actions 的测试签名缓存仍在，同一签名 + 更高 versionCode 的 Preview 可以直接覆盖升级。该方案仅用于当前单人测试，不作为正式生产签名方案。'
          gh release create "$TAG" Echo-preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Echo 3.12 Preview #${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
