name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: echo-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK for PR / non-main runs
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prepare debug CI artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk Echo-debug.apk

      - name: Upload debug CI artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Echo-debug-${{ github.run_number }}
          path: Echo-debug.apk
          retention-days: 14

      - name: Restore cached Preview v2 test signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.echo-preview-signing-v2
          key: echo-preview-test-signing-v2

      - name: Prepare Preview v2 test signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_DIR="$HOME/.echo-preview-signing-v2"
          KEYSTORE_PATH="$SIGNING_DIR/echo-preview-test-v2.jks"
          PASSWORD_PATH="$SIGNING_DIR/.password"
          KEY_ALIAS="echo-preview-test-v2"

          mkdir -p "$SIGNING_DIR"

          if [ ! -s "$KEYSTORE_PATH" ] || [ ! -s "$PASSWORD_PATH" ]; then
            echo "::notice::Creating a new rotated test-only Preview signing key (v2)."
            rm -f "$KEYSTORE_PATH" "$PASSWORD_PATH"

            SIGNING_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$SIGNING_PASSWORD"
            printf '%s' "$SIGNING_PASSWORD" > "$PASSWORD_PATH"
            chmod 600 "$PASSWORD_PATH"

            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$SIGNING_PASSWORD" \
              -keypass "$SIGNING_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 36500 \
              -dname "CN=Echo Preview Test v2,O=Echo,C=XX"
            chmod 600 "$KEYSTORE_PATH"
          else
            SIGNING_PASSWORD="$(cat "$PASSWORD_PATH")"
            echo "::add-mask::$SIGNING_PASSWORD"
          fi

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$SIGNING_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Configure signed Preview version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION_CODE=$((3120000 + GITHUB_RUN_NUMBER))
          echo "MESSAGE_RELAY_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "MESSAGE_RELAY_VERSION_NAME=3.12" >> "$GITHUB_ENV"
          echo "Echo Preview versionName=3.12 versionCode=$VERSION_CODE"

      - name: Assemble signed release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_DIR="$HOME/.echo-preview-signing-v2"
          KEYSTORE_PATH="$SIGNING_DIR/echo-preview-test-v2.jks"
          PASSWORD_PATH="$SIGNING_DIR/.password"
          KEY_ALIAS="echo-preview-test-v2"
          SIGNING_PASSWORD="$(cat "$PASSWORD_PATH")"

          echo "::add-mask::$SIGNING_PASSWORD"
          export MESSAGE_RELAY_KEYSTORE_PATH="$KEYSTORE_PATH"
          export MESSAGE_RELAY_KEYSTORE_PASSWORD="$SIGNING_PASSWORD"
          export MESSAGE_RELAY_KEY_ALIAS="$KEY_ALIAS"
          export MESSAGE_RELAY_KEY_PASSWORD="$SIGNING_PASSWORD"

          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Prepare signed Preview APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk Echo-preview.apk

      - name: Upload signed Preview artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Echo-preview-${{ github.run_number }}-release
          path: Echo-preview.apk
          retention-days: 14

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="preview-${GITHUB_RUN_NUMBER}"
          NOTES=$'测试专用 v2 轮换签名构建的 Echo Android Preview。versionName=3.12，versionCode='"${MESSAGE_RELAY_VERSION_CODE}"$'，Commit: '"${GITHUB_SHA}"$'。\n\n安全迁移提示：Preview #16/#18 使用的 v1 测试签名密码曾出现在公开 Actions 日志，因此 v1 已废弃。首次从 #18 迁移到本 v2 Preview 时需要完整卸载旧版一次；这是主动安全轮换，不是覆盖升级 bug。安装首个 v2 Preview 后，后续 v2 Preview 仍应可直接覆盖升级。该方案仅用于当前单人测试，不作为正式生产签名方案。'
          gh release create "$TAG" Echo-preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Echo 3.12 Preview #${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"
