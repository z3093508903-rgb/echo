name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Prepare preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Echo-preview.apk

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-preview-${{ github.run_number }}
          path: Echo-preview.apk
          retention-days: 14

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Echo-preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Echo Preview #${GITHUB_RUN_NUMBER}" \
            --notes "自动构建的 Echo Android 测试包。仅用于真机反馈，不代表稳定版本。Commit: ${GITHUB_SHA}" \
            --prerelease \
            --target "$GITHUB_SHA"
